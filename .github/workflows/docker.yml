name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  docker:
    name: Build and push Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zhf883680/layerwatch
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=LayerWatch
            org.opencontainers.image.description=AI print monitoring and timelapse for Home Assistant
            org.opencontainers.image.url=https://github.com/zhf883680/LayerWatch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update Docker Hub description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zhf883680/layerwatch
          short-description: "AI-powered 3D print monitoring, anomaly detection, and timelapse via Home Assistant."
          readme-filepath: ./README.dockerhub.md

  release:
    name: GitHub Release
    needs:
      - test
      - docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          rm -rf release
          mkdir -p release
          for target in arm64 armv7; do
            if [ "$target" = "arm64" ]; then
              export GOARCH=arm64
              export GOARM=""
              export ARCH_LABEL="arm64"
            else
              export GOARCH=arm
              export GOARM=7
              export ARCH_LABEL="armv7"
            fi
            mkdir -p "package/config" "package/img"
            CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o package/layerwatch ./cmd/server
            cp config/config.example.yaml package/config/config.yaml
            cp README.md README.en.md package/
            cp web/layerwatch.svg package/icon.svg
            cp web/layerwatch-512.png package/icon.png
            cp img/ai-analysis.png img/timelapse.png img/settings.png package/img/
            tar -C package -czf "release/layerwatch-${VERSION}-linux-${ARCH_LABEL}.tar.gz" .
            rm -rf package
          done
          cd release
          sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/checksums.txt
