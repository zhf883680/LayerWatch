homeAssistant:
  baseURL: "http://homeassistant.local:8123"
  token: "YOUR_LONG_LIVED_ACCESS_TOKEN"
  cameraEntity: "camera.bambu_lab_camera"
  layerEntity: "sensor.bambu_lab_current_layer"
  statusEntity: "sensor.bambu_lab_print_status"

ai:
  enabled: true
  baseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  apiKey: "YOUR_API_KEY"
  model: "qwen3-vl-flash"
  maxImageWidth: 1280 # 发给 AI 前把帧缩到该宽度，0 = 不压缩；缩图最省 token
  imageSource: "base64" # base64 | temp（阿里云百炼临时文件 URL，请求体更小）
  maxChecksPerPrint: 50
  minIntervalSeconds: 30

trigger:
  mode: "layer"
  intervalSeconds: 10

cleanup:
  retentionDays: 7

lighting:
  enabled: false
  entity: "light.bambu_lab_chamber_light"
  delaySeconds: 3
  keepOnDuringPrint: true

notification:
  haEnabled: true
  barkEnabled: false
  barkKey: ""
  barkBaseURL: "https://api.day.app"
  barkGroup: "LayerWatch"
  barkLevel: ""
  barkVolume: 0
